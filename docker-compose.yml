services:
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    container_name: valkyrie-server
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - HOST=0.0.0.0
      - USE_IN_MEMORY_STORE=true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:4000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  client:
    build:
      context: .
      dockerfile: apps/client/Dockerfile
    container_name: valkyrie-client
    ports:
      - "5173:80"
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped
